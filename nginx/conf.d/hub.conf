# Local-dev nginx for reading-hub.
# Production sits behind a different nginx with TLS + rate limiting.

limit_req_zone $binary_remote_addr zone=hub_api:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Redirect bare /hub to /hub/ so the alias resolves.
    location = /hub {
        return 301 /hub/;
    }

    location /hub/ {
        alias /var/www/hub/;
        try_files $uri $uri/ /hub/index.html;
    }

    location /api/ {
        limit_req zone=hub_api burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 302 /hub/;
    }
}
